name: Build ZMK Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout config
        uses: actions/checkout@v4
        with:
          path: config
          submodules: true

      - name: Initialize ZMK workspace
        run: |
          cd config
          west init -l .
          west update

      - name: Build firmware
        run: |
          cd config
          west build -p -b keychron_b1_pro_ansi
