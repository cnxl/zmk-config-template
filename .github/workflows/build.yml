name: Build B1 Pro Firmware

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Build firmware
        uses: zmkfirmware/zmk-build-action@v2
        with:
          board: keychron_b1_pro_ansi
          shield: ""
          config-file: config/keychron_b1_pro_ansi.conf
